<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Little Chef's Happy Kitchen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#FFF3DC;
        --bg2:#FFE7C2;
        --card:#FFFFFF;
        --ink:#4A3226;
        --ink-soft:#7A5B48;
        --coral:#FF6B4A;
        --coral-dark:#D94F30;
        --teal:#22B8A2;
        --teal-dark:#15937F;
        --sun:#FFC93C;
        --sun-dark:#E8A90C;
        --pink:#FF8FAB;
        --berry:#EF5D8F;
        --green:#7BC950;
        --green-dark:#57A832;
        --sky:#7ED3E8;
        --counter:#F7C98B;
        --counter-edge:#E8A95C;
        --wall:#FFE9C9;
        --shadow:0 6px 0 rgba(120,66,20,.18);
        --radius:22px;
        color-scheme:light;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#2B1D16;
          --bg2:#3A2718;
          --card:#43301F;
          --ink:#FFE9CF;
          --ink-soft:#D9B48F;
          --coral:#FF7D5C;
          --coral-dark:#E5502F;
          --teal:#2FD3B8;
          --teal-dark:#1FA892;
          --sun:#FFD34D;
          --sun-dark:#E8A90C;
          --wall:#4A3423;
          --counter:#6B4A2A;
          --counter-edge:#54381D;
          --shadow:0 6px 0 rgba(0,0,0,.45);
          color-scheme:dark;
        }
      }
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
      html,body{margin:0;padding:0}
      body{
        font-family:"Baloo 2","Nunito","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
        background:
          radial-gradient(circle at 12% 20%, rgba(255,201,60,.20) 0 26px, transparent 27px),
          radial-gradient(circle at 88% 12%, rgba(255,143,171,.20) 0 20px, transparent 21px),
          radial-gradient(circle at 78% 84%, rgba(126,211,232,.18) 0 30px, transparent 31px),
          linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
        background-attachment:fixed;
        color:var(--ink);
        min-height:100dvh;
        overflow-x:hidden;
      }
      button{font-family:inherit;color:inherit}
      :focus-visible{outline:4px solid var(--teal);outline-offset:3px;border-radius:12px}
      .app{max-width:1120px;margin:0 auto;padding:10px clamp(10px,3vw,28px) calc(18px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column}
      .hidden{display:none !important}

      /* ---------- buttons ---------- */
      .btn{
        border:none;cursor:pointer;border-radius:999px;font-weight:800;
        display:inline-flex;align-items:center;justify-content:center;gap:10px;
        min-height:56px;padding:12px 26px;font-size:clamp(18px,2.6vw,24px);
        touch-action:manipulation;user-select:none;-webkit-user-select:none;
        transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
      }
      .btn:active{transform:translateY(4px)}
      .btn-play{background:var(--coral);color:#fff;font-size:clamp(26px,5vw,38px);padding:16px 52px;box-shadow:0 8px 0 var(--coral-dark);letter-spacing:.5px}
      .btn-play:active{box-shadow:0 2px 0 var(--coral-dark)}
      .btn-sun{background:var(--sun);color:#5B3A00;box-shadow:0 6px 0 var(--sun-dark)}
      .btn-sun:active{box-shadow:0 2px 0 var(--sun-dark)}
      .btn-teal{background:var(--teal);color:#fff;box-shadow:0 6px 0 var(--teal-dark)}
      .btn-teal:active{box-shadow:0 2px 0 var(--teal-dark)}
      .btn-pink{background:var(--berry);color:#fff;box-shadow:0 6px 0 #C23A68}
      .btn-pink:active{box-shadow:0 2px 0 #C23A68}
      .btn-green{background:var(--green);color:#fff;box-shadow:0 6px 0 var(--green-dark)}
      .btn-green:active{box-shadow:0 2px 0 var(--green-dark)}
      .btn-ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 rgba(120,66,20,.25);border:3px solid rgba(120,66,20,.15)}
      .btn-ghost:active{box-shadow:0 1px 0 rgba(120,66,20,.25)}
      .btn-done{font-size:clamp(22px,4vw,30px);padding:14px 44px;animation:doneGlow 1.1s ease-in-out infinite}
      @keyframes doneGlow{0%,100%{box-shadow:0 6px 0 var(--green-dark),0 0 0 0 rgba(123,201,80,.0)}50%{box-shadow:0 6px 0 var(--green-dark),0 0 0 10px rgba(123,201,80,.45)}}
      .btn[disabled]{opacity:.45;pointer-events:none}
      .icon-btn{
        width:56px;height:56px;min-width:56px;border-radius:50%;border:3px solid rgba(120,66,20,.14);
        background:var(--card);box-shadow:0 4px 0 rgba(120,66,20,.22);cursor:pointer;
        display:inline-flex;align-items:center;justify-content:center;font-size:26px;line-height:1;
        touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .12s ease;
      }
      .icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,66,20,.22)}
      .icon-btn svg{width:30px;height:30px}
      @keyframes wigglePulse{0%,100%{transform:scale(1) rotate(-1deg)}50%{transform:scale(1.06) rotate(1deg)}}

      /* ---------- top bar ---------- */
      .topbar{display:flex;align-items:center;gap:10px;padding:6px 2px 10px;flex-wrap:wrap}
      .topbar .spacer{flex:1}
      .order-chip{
        display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid rgba(120,66,20,.14);
        border-radius:999px;padding:5px 14px 5px 6px;font-weight:800;font-size:16px;box-shadow:0 3px 0 rgba(120,66,20,.15);
      }
      .order-chip .mini{width:38px;height:38px}
      .order-chip .mini svg{width:100%;height:100%}

      /* ---------- welcome ---------- */
      .welcome{text-align:center;padding-top:clamp(6px,3vh,30px);flex:1;display:flex;flex-direction:column;align-items:center}
      .logo-badge{
        background:var(--card);border-radius:34px;padding:10px 30px 14px;box-shadow:var(--shadow);
        border:4px solid var(--sun);transform:rotate(-1.5deg);max-width:94vw;
      }
      .logo-badge h1{margin:0;font-size:clamp(30px,7.2vw,58px);line-height:1.02;font-weight:800;color:var(--coral-dark)}
      .logo-badge h1 .alt{color:var(--teal-dark)}
      .logo-badge p{margin:2px 0 0;font-size:clamp(15px,3vw,21px);color:var(--ink-soft);font-weight:700}
      .mascot-stage{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin:8px 0 2px}
      .mascot{width:clamp(150px,34vw,230px);animation:bob 2.6s ease-in-out infinite}
      .mascot svg{width:100%;height:auto;display:block}
      @keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
      .welcome-btns{display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:12px}
      .welcome-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:16px}
      .sticker-count-chip{background:var(--card);border-radius:999px;padding:8px 18px;font-weight:800;font-size:17px;box-shadow:0 3px 0 rgba(120,66,20,.18);display:inline-flex;gap:8px;align-items:center}
      .kitchen-strip{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
      .kitchen-strip .food-mini{width:clamp(46px,10vw,64px);height:clamp(46px,10vw,64px);background:var(--card);border-radius:18px;box-shadow:0 3px 0 rgba(120,66,20,.15);padding:7px;animation:bob 3s ease-in-out infinite}
      .kitchen-strip .food-mini:nth-child(2n){animation-delay:.4s}.kitchen-strip .food-mini:nth-child(3n){animation-delay:.8s}
      .kitchen-strip .food-mini svg{width:100%;height:100%}

      /* ---------- lobby ---------- */
      .lobby-scene{
        position:relative;background:linear-gradient(180deg,var(--wall) 0 62%,var(--counter) 62% 100%);
        border-radius:28px;border:4px solid rgba(120,66,20,.12);box-shadow:var(--shadow);
        padding:18px 14px 14px;overflow:hidden;
      }
      .lobby-scene::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 18%, rgba(255,201,60,.35) 0 44px, transparent 45px);pointer-events:none}
      .customer-row{display:flex;align-items:flex-end;gap:8px;justify-content:center;position:relative}
      .customer{width:clamp(120px,30vw,180px);animation:bob 3.2s ease-in-out infinite}
      .customer svg{width:100%;height:auto;display:block}
      .order-bubble{
        background:#fff;color:#4A3226;border-radius:22px;padding:10px 14px;max-width:250px;position:relative;
        box-shadow:0 4px 0 rgba(120,66,20,.18);font-weight:800;font-size:clamp(15px,3.4vw,19px);text-align:center;
      }
      .order-bubble::after{content:"";position:absolute;left:-12px;bottom:26px;border:8px solid transparent;border-right-color:#fff}
      .order-bubble .want{width:clamp(64px,16vw,88px);height:clamp(64px,16vw,88px);margin:4px auto 0}
      .order-bubble .want svg{width:100%;height:100%}
      .lobby-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px}

      /* ---------- recipe grid ---------- */
      .section-title{font-size:clamp(24px,5vw,36px);margin:6px 0 2px;font-weight:800;text-align:center}
      .section-sub{text-align:center;color:var(--ink-soft);font-weight:700;margin:0 0 14px;font-size:clamp(15px,3vw,18px)}
      .recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
      @media (max-width:380px){.recipe-grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}}
      .recipe-card{
        background:var(--card);border:4px solid rgba(120,66,20,.10);border-radius:24px;padding:12px 8px 12px;
        cursor:pointer;text-align:center;box-shadow:0 5px 0 rgba(120,66,20,.16);position:relative;
        touch-action:manipulation;user-select:none;-webkit-user-select:none;font-family:inherit;color:inherit;width:100%;
        transition:transform .12s ease;
      }
      .recipe-card:active{transform:scale(.96)}
      .recipe-card .art{width:clamp(74px,18vw,104px);height:clamp(74px,18vw,104px);margin:0 auto}
      .recipe-card .art svg{width:100%;height:100%}
      .recipe-card h3{margin:6px 0 2px;font-size:clamp(17px,3.6vw,21px);font-weight:800}
      .hats{display:flex;gap:2px;justify-content:center;min-height:20px}
      .hats svg{width:20px;height:20px}
      .done-badge{
        position:absolute;top:8px;right:8px;background:var(--green);color:#fff;border-radius:999px;
        font-size:13px;font-weight:800;padding:3px 9px;box-shadow:0 2px 0 var(--green-dark);
      }
      .order-star{
        position:absolute;top:8px;left:8px;background:var(--sun);color:#5B3A00;border-radius:999px;
        font-size:13px;font-weight:800;padding:3px 9px;box-shadow:0 2px 0 var(--sun-dark);
      }

      /* ---------- cooking ---------- */
      .cook-layout{display:flex;flex-direction:column;gap:12px;flex:1}
      .progress-dots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;padding:2px 0}
      .pdot{width:20px;height:20px;border-radius:50%;background:var(--card);border:3px solid rgba(120,66,20,.22);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:800}
      .pdot.done{background:var(--green);border-color:var(--green-dark)}
      .pdot.now{background:var(--sun);border-color:var(--sun-dark);animation:wigglePulse 1.1s ease-in-out infinite}
      .coach-row{display:flex;gap:10px;align-items:flex-end}
      .coach-pip{width:clamp(74px,17vw,104px);flex:none;animation:bob 2.8s ease-in-out infinite}
      .coach-pip svg{width:100%;height:auto;display:block}
      .speech{
        background:#fff;color:#4A3226;border-radius:20px;padding:10px 14px;font-weight:800;position:relative;flex:1;
        font-size:clamp(17px,4vw,23px);line-height:1.25;box-shadow:0 4px 0 rgba(120,66,20,.16);min-height:64px;
        display:flex;align-items:center;gap:8px;
      }
      .speech::after{content:"";position:absolute;left:-11px;bottom:18px;border:7px solid transparent;border-right-color:#fff}
      .speech .say{flex:1}
      .speak-btn{flex:none;width:48px;height:48px;border-radius:50%;border:none;background:var(--sun);cursor:pointer;font-size:22px;box-shadow:0 3px 0 var(--sun-dark);touch-action:manipulation}
      .speak-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sun-dark)}
      .stage-wrap{
        position:relative;border-radius:28px;overflow:hidden;border:4px solid rgba(120,66,20,.14);
        box-shadow:var(--shadow);background:var(--wall);aspect-ratio:4/3;max-height:52dvh;margin:0 auto;width:100%;
        touch-action:manipulation;
      }
      .stage-wrap svg.scene{position:absolute;inset:0;width:100%;height:100%}
      .stage-wrap.tappable{cursor:pointer}
      .stage-wrap.squash .dish-g{animation:squash .3s ease}
      .stage-wrap.wiggle .dish-g{animation:wiggleDish .45s ease}
      .stage-wrap.cooking .steam{opacity:1}
      .stage-wrap.cooking .glowfx{opacity:.85}
      @keyframes squash{0%{transform:scale(1,1)}40%{transform:scale(1.07,.9)}100%{transform:scale(1,1)}}
      @keyframes wiggleDish{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
      .dish-g{transform-origin:200px 190px}
      .cook-progress{height:22px;background:var(--card);border-radius:999px;border:3px solid rgba(120,66,20,.16);overflow:hidden;box-shadow:inset 0 2px 4px rgba(120,66,20,.15)}
      .cook-progress .fill{height:100%;width:0%;background:repeating-linear-gradient(45deg,var(--coral) 0 16px,#FF8A66 16px 32px);border-radius:999px;transition:width .2s linear}
      .tap-dots{display:flex;gap:8px;justify-content:center}
      .tap-dot{width:26px;height:26px;border-radius:50%;background:var(--card);border:3px solid rgba(120,66,20,.2)}
      .tap-dot.filled{background:var(--pink);border-color:var(--berry);animation:popIn .25s ease}
      @keyframes popIn{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
      .tray-zone{background:var(--card);border-radius:24px;border:3px solid rgba(120,66,20,.12);box-shadow:0 4px 0 rgba(120,66,20,.12);padding:12px}
      .tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
      .tray-item{
        width:clamp(76px,19vw,96px);border-radius:20px;border:3px solid rgba(120,66,20,.14);background:var(--bg);
        padding:8px 4px 6px;cursor:grab;text-align:center;position:relative;touch-action:none;
        box-shadow:0 4px 0 rgba(120,66,20,.16);user-select:none;-webkit-user-select:none;font-family:inherit;color:inherit;
        transition:transform .12s ease, opacity .2s ease;
      }
      .tray-item:active{cursor:grabbing}
      .tray-item .art{width:52px;height:52px;margin:0 auto;pointer-events:none}
      .tray-item .art svg{width:100%;height:100%}
      .tray-item .lbl{font-size:14px;font-weight:800;line-height:1.1;display:block;margin-top:2px;pointer-events:none}
      .tray-item.needed{animation:itemGlow 1.2s ease-in-out infinite;border-color:var(--sun-dark)}
      @keyframes itemGlow{0%,100%{box-shadow:0 4px 0 rgba(120,66,20,.16),0 0 0 0 rgba(255,201,60,.0)}50%{box-shadow:0 4px 0 rgba(120,66,20,.16),0 0 0 7px rgba(255,201,60,.55)}}
      .tray-item.used{opacity:.32;pointer-events:none;filter:grayscale(.4)}
      .count-badge{position:absolute;top:-8px;right:-8px;background:var(--berry);color:#fff;border-radius:999px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;padding:0 7px;box-shadow:0 2px 0 #C23A68}
      .action-zone{display:flex;flex-direction:column;align-items:center;gap:10px}
      .big-action{min-width:min(340px,86vw)}
      .drag-ghost{position:fixed;z-index:90;width:76px;height:76px;pointer-events:none;opacity:.92;filter:drop-shadow(0 8px 8px rgba(0,0,0,.3))}
      .drag-ghost svg{width:100%;height:100%}
      .fly-dot{position:fixed;z-index:91;width:64px;height:64px;pointer-events:none;transition:all .45s cubic-bezier(.3,.7,.4,1)}
      .fly-dot svg{width:100%;height:100%}
      .sparkle{position:absolute;font-size:22px;pointer-events:none;animation:sparkleUp .8s ease-out forwards;z-index:5}
      @keyframes sparkleUp{0%{transform:translateY(0) scale(.5);opacity:0}25%{opacity:1}100%{transform:translateY(-56px) scale(1.2);opacity:0}}
      .hint-pulse{animation:itemGlow 1s ease-in-out infinite !important}

      /* ---------- hands-on gesture actions ---------- */
      .stage-wrap.gesture{touch-action:none;cursor:pointer}
      .stage-wrap.flipping .dish-g{animation:flipAnim .55s ease}
      @keyframes flipAnim{0%{transform:translateY(0) scaleY(1)}40%{transform:translateY(-58px) scaleY(1)}58%{transform:translateY(-58px) scaleY(-1)}100%{transform:translateY(0) scaleY(-1)}}
      .tool-hand{
        position:absolute;width:88px;height:88px;margin-left:-44px;margin-top:-62px;pointer-events:none;z-index:6;
        filter:drop-shadow(0 7px 7px rgba(90,40,0,.35));opacity:0;transition:opacity .18s ease;
      }
      .tool-hand svg{width:100%;height:100%}
      .tool-hand.show{opacity:1}
      .tool-hand.tool-big{width:106px;height:106px;margin-left:-53px;margin-top:-70px}
      @keyframes demoSaw{0%,100%{transform:translate(-30px,0) rotate(-9deg)}50%{transform:translate(30px,0) rotate(9deg)}}
      @keyframes demoSpread{0%,100%{transform:translate(-24px,-10px) rotate(-7deg)}50%{transform:translate(24px,12px) rotate(7deg)}}
      @keyframes demoStir{0%{transform:translate(0,-17px)}25%{transform:translate(17px,0)}50%{transform:translate(0,17px)}75%{transform:translate(-17px,0)}100%{transform:translate(0,-17px)}}
      @keyframes demoPour{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-26deg) translate(-8px,8px)}}
      @keyframes demoFlip{0%,100%{transform:translateY(0)}45%{transform:translateY(-22px) rotate(-6deg)}}
      .tool-hand.demo-saw{animation:demoSaw 1.15s ease-in-out infinite}
      .tool-hand.demo-spread{animation:demoSpread 1.5s ease-in-out infinite}
      .tool-hand.demo-stir{animation:demoStir 1.6s linear infinite}
      .tool-hand.demo-pour{animation:demoPour 1.5s ease-in-out infinite}
      .tool-hand.demo-flip{animation:demoFlip 1.3s ease-in-out infinite}
      .gesture-tip{
        display:inline-flex;align-items:center;gap:10px;background:var(--card);border:3px solid rgba(120,66,20,.14);
        border-radius:999px;padding:7px 20px 7px 9px;font-weight:800;font-size:clamp(16px,3.4vw,20px);
        box-shadow:0 4px 0 rgba(120,66,20,.16);
      }
      .gesture-tip .g-tool{width:42px;height:42px;flex:none;display:inline-block}
      .gesture-tip .g-tool svg{width:100%;height:100%}

      @media (min-width:820px){
        .cook-layout{flex-direction:row;align-items:flex-start}
        .cook-left{flex:1.35;min-width:0}
        .cook-right{flex:1;display:flex;flex-direction:column;gap:12px;min-width:300px}
        .stage-wrap{max-height:none}
      }

      /* ---------- celebration ---------- */
      .celebrate{text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
      .celebrate h2{font-size:clamp(30px,7vw,48px);margin:8px 0 0;color:var(--coral-dark);font-weight:800}
      .celebrate .yum{font-size:clamp(17px,4vw,22px);font-weight:700;color:var(--ink-soft);margin:0}
      .serve-stage{width:min(420px,88vw)}
      .serve-stage svg{width:100%;height:auto;display:block}
      .sticker-award{
        background:var(--card);border:4px dashed var(--sun-dark);border-radius:24px;padding:12px 22px;
        display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);animation:stickerIn .6s cubic-bezier(.2,1.6,.4,1);
      }
      @keyframes stickerIn{0%{transform:scale(.2) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-2deg);opacity:1}}
      .sticker-award .art{width:72px;height:72px}
      .sticker-award .art svg{width:100%;height:100%}
      .sticker-award .txt{text-align:left}
      .sticker-award .txt b{font-size:20px;display:block}
      .sticker-award .txt span{color:var(--ink-soft);font-weight:700}
      .confetti{position:absolute;top:-8px;width:12px;height:18px;border-radius:3px;pointer-events:none;animation:confettiFall linear forwards;z-index:3}
      @keyframes confettiFall{0%{transform:translateY(-4vh) rotate(0)}100%{transform:translateY(88vh) rotate(560deg)}}

      /* ---------- stickers ---------- */
      .sticker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
      .sticker-cell{background:var(--card);border-radius:20px;border:3px solid rgba(120,66,20,.1);padding:10px 6px;text-align:center;box-shadow:0 3px 0 rgba(120,66,20,.12)}
      .sticker-cell .art{width:62px;height:62px;margin:0 auto}
      .sticker-cell .art svg{width:100%;height:100%}
      .sticker-cell .nm{font-weight:800;font-size:14px;margin-top:4px;line-height:1.15}
      .sticker-cell .cnt{font-size:13px;color:var(--ink-soft);font-weight:700}
      .sticker-cell.locked .art{filter:grayscale(1);opacity:.28}

    <script>
"use strict";
/* =========================================================
   Little Chef's Happy Kitchen — single-file game
   Data-driven recipe engine + SVG art + WebAudio sounds.
   ========================================================= */

/* ---------- safe storage (progress lives in this browser only) ---------- */
const store = {
  ok:false, mem:{},
  init(){ try{ const t="__lchk_t"; localStorage.setItem(t,"1"); localStorage.removeItem(t); this.ok=true; }catch(e){ this.ok=false; } },
  get(k,d){ try{ if(this.ok){ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); } }catch(e){} return (k in this.mem)?this.mem[k]:d; },
  set(k,v){ try{ if(this.ok){ localStorage.setItem(k,JSON.stringify(v)); return; } }catch(e){} this.mem[k]=v; }
};
store.init();

const SAVE_KEY="lchk-save-v1";
let save = store.get(SAVE_KEY,null);
if(!save || typeof save!=="object" || !save.stickers){
  save = { stickers:{}, completions:{}, totalStars:0, sound:true, music:true, voice:true, played:false };
}
function persist(){ store.set(SAVE_KEY, save); }

/* ---------- tiny utils ---------- */
const $=(sel,el)=> (el||document).querySelector(sel);
const el=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rand=a=>a[Math.floor(Math.random()*a.length)];
const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- audio: WebAudio synths + speech (starts on first tap) ---------- */
const AudioSys = {
  ctx:null, musicTimer:null, musicStep:0,
  ensure(){
    if(this.ctx) { if(this.ctx.state==="suspended") this.ctx.resume(); return; }
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      this.ctx = new AC();
    }catch(e){ this.ctx=null; }
  },
  tone(freq, dur, type, vol, when, slideTo){
    if(!this.ctx || !save.sound) return;
    try{
      const t=this.ctx.currentTime+(when||0);
      const o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
      if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t); o.stop(t+dur+0.05);
    }catch(e){}
  },
  noise(dur, vol, freq){
    if(!this.ctx || !save.sound) return;
    try{
      const t=this.ctx.currentTime, len=Math.floor(this.ctx.sampleRate*dur);
      const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
      const src=this.ctx.createBufferSource(); src.buffer=buf;
      const f=this.ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq||1200;
      const g=this.ctx.createGain(); g.gain.value=vol||0.06;
      src.connect(f); f.connect(g); g.connect(this.ctx.destination); src.start(t);
    }catch(e){}
  },
  pop(){ this.tone(520,0.12,"sine",0.18,0,880); },
  click(){ this.tone(700,0.06,"triangle",0.10); },
  ding(){ this.tone(1046,0.35,"sine",0.16); this.tone(1568,0.4,"sine",0.10,0.08); },
  boing(){ this.tone(220,0.25,"sine",0.14,0,520); },
  sizzle(){ this.noise(0.5,0.05,2600); },
  bubble(){ this.tone(300,0.15,"sine",0.08,0,600); this.tone(360,0.15,"sine",0.07,0.12,720); },
  whirr(){ for(let i=0;i<5;i++) this.tone(160+i*30,0.09,"sawtooth",0.035,i*0.09); },
  fanfare(){
    const seq=[[523,0],[659,0.13],[784,0.26],[1046,0.39],[784,0.55],[1046,0.68]];
    seq.forEach(([f,w])=>this.tone(f,0.24,"triangle",0.16,w));
  },
  startMusic(){
    if(!this.ctx || !save.music || this.musicTimer) return;
    const melody=[523,587,659,784,659,587,523,587,659,523,587,659,880,784,659,587];
    const bass  =[262,262,330,262, 262,262,330,392, 262,262,330,262, 330,330,262,262];
    this.musicStep=0;
    const tick=()=>{
      if(!save.music){ return; }
      const i=this.musicStep%16;
      if(save.sound){ this.tone(melody[i],0.32,"triangle",0.045); this.tone(bass[i],0.32,"sine",0.05); }
      this.musicStep++;
    };
    tick();
    this.musicTimer=setInterval(tick,340);
  },
  stopMusic(){ if(this.musicTimer){ clearInterval(this.musicTimer); this.musicTimer=null; } },
  speak(text){
    if(!save.voice) return;
    try{
      if(!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.rate=0.95; u.pitch=1.15; u.lang="en-US";
      window.speechSynthesis.speak(u);
    }catch(e){}
  },
  stopSpeak(){ try{ if("speechSynthesis" in window) window.speechSynthesis.cancel(); }catch(e){} }
};

/* ---------- characters: Pip the chef mascot + animal customers ---------- */
function chefHat(cx,cy,s){
  return '<g transform="translate('+cx+' '+cy+') scale('+s+')">'
    +'<path d="M-34 6 q-14 -3 -12 -17 q1 -11 13 -12 q2 -13 16 -13 q6 -7 14 0 q14 0 16 13 q12 1 13 12 q2 14 -12 17 l0 10 q0 5 -6 5 L-28 21 q-6 0 -6 -5 Z" fill="#FFFFFF" stroke="#E4D5BE" stroke-width="2.4"/>'
    +'<path d="M-34 10 L34 10" stroke="#E4D5BE" stroke-width="3"/></g>';
}
function pipSVG(happy){
  const mouth = happy
    ? '<path d="M84 118 Q100 134 116 118 Q108 130 100 130 Q92 130 84 118Z" fill="#8A4A26"/><circle cx="74" cy="108" r="7" fill="#FFB3C1"/><circle cx="126" cy="108" r="7" fill="#FFB3C1"/>'

  const eyes = happy
    ? '<path d="M76 92 q7 -7 14 0 M110 92 q7 -7 14 0" stroke="#4A3226" stroke-width="3.6" fill="none" stroke-linecap="round"/>'
    : '<circle cx="83" cy="92" r="4.4" fill="#4A3226"/><circle cx="117" cy="92" r="4.4" fill="#4A3226"/><circle cx="84.6" cy="90.4" r="1.6" fill="#fff"/><circle cx="118.6" cy="90.4" r="1.6" fill="#fff"/>';

    +'<ellipse cx="100" cy="196" rx="52" ry="10" fill="rgba(120,66,20,.15)"/>'

const G = {
  screen:"welcome",
  recipe:null, stepIdx:0,
  picked:{}, chosen:{}, tapsDone:0,
  cooking:false, cookTimer:null, cookToken:0,
  rewardGiven:false, served:false,
  orderRecipe:null, orderCustomer:0,
  hintTimer:null, dragInfo:null, suppressClickUntil:0, gx:null
};
function newOrder(){
  G.orderRecipe = rand(RECIPES).id;
  G.orderCustomer = Math.floor(Math.random()*CUSTOMERS.length);
}
newOrder();

function stickerTotal(){ return Object.keys(save.stickers).length; }
function totalStickerSlots(){ return RECIPES.length + MILESTONES.length; }

function soundBtnHTML(){
  return '<button class="icon-btn" id="btn-sound" aria-label="'+(save.sound?"Turn sound off":"Turn sound on")+'">'+(save.sound?ICONS.soundOnIcon:ICONS.soundOffIcon)+'</button>';
}
function bindSoundBtn(root){
  const b=$("#btn-sound",root); if(!b) return;
  b.addEventListener("click",()=>{
    save.sound=!save.sound; persist();
    if(save.sound){ AudioSys.ensure(); AudioSys.click(); AudioSys.startMusic(); }
    else { AudioSys.stopMusic(); AudioSys.stopSpeak(); }
    render();
  });
}
function topBarHTML(opts){
  opts=opts||{};
  let h='<div class="topbar">';
  if(opts.home) h+='<button class="icon-btn" id="btn-home" aria-label="Go home">'+ICONS.homeIcon+'</button>';
  if(opts.title) h+='<strong style="font-size:clamp(19px,4vw,26px)">'+esc(opts.title)+'</strong>';
  h+='<span class="spacer"></span>';
  if(opts.order && G.recipe){
    h+='<span class="order-chip"><span class="mini">'+ICONS[G.recipe.icon]+'</span>'+esc(G.recipe.name)+'</span>';
  }
  if(opts.stickers) h+='<button class="btn btn-sun" id="btn-stickers" style="min-height:52px;padding:8px 18px;font-size:17px">'+ICONS.starIcon.replace('<svg','<svg width="22" height="22"')+' My Stickers ('+stickerTotal()+')</button>';
  if(opts.restart) h+='<button class="icon-btn" id="btn-restart" aria-label="Restart this recipe">'+ICONS.restartIcon+'</button>';
  if(opts.pause) h+='<button class="icon-btn" id="btn-pause" aria-label="Pause">'+ICONS.pauseIcon+'</button>';
  h+=soundBtnHTML();
  h+='</div>';
  return h;
}
function bindTopBar(root){
  bindSoundBtn(root);
  const home=$("#btn-home",root); if(home) home.addEventListener("click",()=>{ stopCooking(); AudioSys.click(); goScreen("lobby"); });
  const st=$("#btn-stickers",root); if(st) st.addEventListener("click",()=>{ AudioSys.click(); goScreen("stickers"); });
  const rs=$("#btn-restart",root); if(rs) rs.addEventListener("click",()=>{ AudioSys.click(); startRecipe(G.recipe.id); });
  const pz=$("#btn-pause",root); if(pz) pz.addEventListener("click",()=>{ AudioSys.click(); openPause(); });
}

/* ---------- screen router ---------- */
function goScreen(name){
  clearHint();
  G.screen=name;
  AudioSys.stopSpeak();
  render();
  window.scrollTo(0,0);
}
function render(){
  const app=el("app");
  if(G.screen==="welcome") app.innerHTML=viewWelcome();
  else if(G.screen==="lobby") app.innerHTML=viewLobby();
  else if(G.screen==="recipes") app.innerHTML=viewRecipes();
  else if(G.screen==="cook") app.innerHTML=viewCook();
  else if(G.screen==="celebrate") app.innerHTML=viewCelebrate();
  else if(G.screen==="stickers") app.innerHTML=viewStickers();
  bindScreen();
}
function bindScreen(){
  const app=el("app");
  if(G.screen==="welcome") bindWelcome(app);
  else if(G.screen==="lobby") bindLobby(app);
  else if(G.screen==="recipes") bindRecipes(app);
  else if(G.screen==="cook") bindCook(app);
  else if(G.screen==="celebrate") bindCelebrate(app);
  else if(G.screen==="stickers") bindTopBar(app);
}

/* ---------- COOKING ---------- */
function startRecipe(id){
  stopCooking();
  G.recipe=RECIPE_BY_ID[id];
  G.stepIdx=0; G.picked={}; G.chosen={}; G.tapsDone=0; G.gx=null; G._advQueued=false;
  G.rewardGiven=false; G.served=false;
  goScreen("cook");
  sayCurrentStep();
}
function curStep(){ return G.recipe.steps[G.stepIdx]; }
function sayCurrentStep(){
  const s=curStep(); if(!s) return;
  const t=$("#speech-text"); if(t) t.textContent=s.say;
  AudioSys.speak(s.say);
}
function stageLayersHTML(){
  let out="";
  G.recipe.steps.forEach((s,i)=>{
    if(i<G.stepIdx){
      if(s.layer) out+=s.layer;
      if(s.type==="pick") s.items.forEach(it=>{ if((G.picked[it.id]||0)>0 && it.layer) out+=it.layer; });
      if(s.type==="choose"){ const c=s.choices.find(x=>x.id===G.chosen[sIdxKey(i)]); if(c&&c.layer) out+=c.layer; }
    } else if(i===G.stepIdx){
      /* current pick step: every item layer is pre-rendered in a toggleable
         group so refreshStage() can reveal it with DOM calls only */
      if(s.type==="pick") s.items.forEach(it=>{ if(it.layer) out+='<g data-lyr="'+it.id+'"'+((G.picked[it.id]||0)>0?'':' style="display:none"')+'>'+it.layer+'</g>'; });
    }
  });
  return out;
}
function sIdxKey(i){ return "s"+i; }
function viewCook(){
  const r=G.recipe, s=curStep();
  if(s && s.type==="gesture" && !G.gx) G.gx=newGestureState(s);
  const dots=r.steps.map((_,i)=>'<span class="pdot '+(i<G.stepIdx?"done":i===G.stepIdx?"now":"")+'">'+(i<G.stepIdx?"\u2713":"")+'</span>').join("")
    +'<span class="pdot" aria-hidden="true">\u2605</span>';
  let zone="";
  if(s.type==="pick"){
    zone='<div class="tray-zone"><div class="tray" role="group" aria-label="Ingredients">'
      + s.items.map(it=>{
          const need=it.count||1, have=G.picked[it.id]||0, used=have>=need;
          const remaining = need-have;
          return '<button class="tray-item'+(used?" used":"")+'" data-item="'+it.id+'" aria-label="Add '+esc(it.label)+(need>1?". Need "+need+", have "+have+".":"")+'" '+(used?"disabled":"")+'>'
            +(remaining>0&&need>1?'<span class="count-badge">'+remaining+'</span>':"")
            +'<span class="art">'+ICONS[it.icon]+'</span><span class="lbl">'+esc(it.label)+'</span></button>';
        }).join("")
      +'</div></div>';
  } else if(s.type==="choose"){
    zone='<div class="tray-zone"><div class="tray" role="group" aria-label="Choices">'
      + s.choices.map(c=>'<button class="tray-item" data-choice="'+c.id+'" aria-label="Choose '+esc(c.label)+'"><span class="art">'+ICONS[c.icon]+'</span><span class="lbl">'+esc(c.label)+'</span></button>').join("")
      +'</div></div>';
  } else if(s.type==="taps"){
    const dotsHtml=Array.from({length:s.taps},(_,i)=>'<span class="tap-dot'+(i<G.tapsDone?" filled":"")+'"></span>').join("");
    zone='<div class="action-zone"><div class="tap-dots" aria-hidden="true">'+dotsHtml+'</div>'
      +'<button class="btn btn-pink big-action" id="btn-tap-action">Tap! '+(s.taps-G.tapsDone)+' to go</button></div>';
  } else if(s.type==="cook"){
    zone='<div class="action-zone"><div class="cook-progress" style="width:min(420px,88vw)" role="progressbar" aria-label="Cooking progress"><div class="fill" id="cook-fill"></div></div>'
      +'<button class="btn btn-pink big-action" id="btn-cook-start">Start Cooking!</button></div>';
  } else if(s.type==="gesture"){
    zone='<div class="action-zone"><div class="cook-progress" style="width:min(420px,88vw)" role="progressbar" aria-label="Action progress"><div class="fill" id="gesture-fill" style="width:'+Math.round((G.gx?G.gx.progress:0)*100)+'%"></div></div>'
      +'<span class="gesture-tip">'+(s.tool?'<span class="g-tool">'+ICONS[s.tool]+'</span>':"")+esc(s.glabel||"Drag to play!")+'</span></div>';
  } else if(s.type==="action"){
    zone='<div class="action-zone"><button class="btn btn-teal big-action" id="btn-do-action"><span style="width:30px;height:30px;display:inline-block">'+ICONS[s.icon||"checkIcon"]+'</span>'+esc(s.btn||"Do it!")+'</button></div>';
  }
  return topBarHTML({home:true, restart:true, pause:true, order:true})
    +'<div class="progress-dots" aria-label="Recipe progress: step '+(G.stepIdx+1)+' of '+r.steps.length+'">'+dots+'</div>'
    +'<div class="cook-layout"><div class="cook-left">'
    +'<div class="stage-wrap'+(s.type==="taps"?" tappable":"")+(s.type==="gesture"?" gesture":"")+'" id="stage" role="img" aria-label="Cooking stage: '+esc(r.name)+'">'
    +'<svg class="scene" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+buildSceneSVG()+'</svg>'
    +(s.type==="gesture"&&s.tool?'<div class="tool-hand show demo demo-'+s.mode+(s.mode==="pour"?" tool-big":"")+'" id="tool-hand" style="left:'+toolHomePct(s).x+'%;top:'+toolHomePct(s).y+'%" aria-hidden="true">'+ICONS[s.tool]+'</div>':"")
    +'</div></div>'
    +'<div class="cook-right">'
    +'<div class="coach-row"><div class="coach-pip">'+pipSVG(false)+'</div>'
    +'<div class="speech"><span class="say" id="speech-text">'+esc(s.say)+'</span><button class="speak-btn" id="btn-say" aria-label="Hear the instruction again">\uD83D\uDD0A</button></div></div>'
    + zone
    +'</div></div>';
}
function pickSatisfied(s){
  const needOk=(s.need||[]).every(id=>{
    const it=s.items.find(x=>x.id===id); return (G.picked[id]||0)>=(it?it.count||1:1);
  });
  if(!needOk) return false;
  const haveDistinct=s.items.filter(it=>(G.picked[it.id]||0)>0).length;
  return haveDistinct >= (s.need?s.need.length:0) + (s.anyOf||0);
}
function refreshDoneZone(){
  const s=curStep(); if(!s||s.type!=="pick") return;
  /* No "All Done" button: once everything needed is picked, the recipe
     flows straight on to the next step by itself. */
  if(pickSatisfied(s) && !G._advQueued){
    G._advQueued=true;
    const idx=G.stepIdx, rid=G.recipe.id;
    AudioSys.ding(); sparkle(el("stage"));
    setTimeout(()=>{
      G._advQueued=false;
      if(G.screen==="cook" && G.recipe && G.recipe.id===rid && G.stepIdx===idx) advanceStep();
    }, reducedMotion?120:600);
  }
  /* refresh used states + badges without a full re-render */
  const tray=$(".tray"); if(tray){
    tray.querySelectorAll("[data-item]").forEach(btn=>{
      const it=s.items.find(x=>x.id===btn.dataset.item); if(!it) return;
      const need=it.count||1, have=G.picked[it.id]||0;
      btn.setAttribute("aria-label","Add "+it.label+(need>1?". Need "+need+", have "+have+".":""));
      if(have>=need){ btn.classList.add("used"); btn.disabled=true; const b=$(".count-badge",btn); if(b) b.remove(); }
      else { const b=$(".count-badge",btn); if(b&&need>1) b.textContent=need-have; }
    });
  }
}
/* DOM-only scene updates. The scene SVG is created once by the HTML parser
   in viewCook(); this function only toggles/moves what is already there.
   (Rebuilding it via svg.innerHTML left an empty stage in some browsers.) */
const SVGNS="http://www.w3.org/2000/svg";
function refreshStage(){
  const stage=el("stage"); if(!stage) return;
  const s=curStep(); if(!s) return;
  if(s.type==="pick"){
    s.items.forEach(it=>{
      if(!it.layer) return;
      const g=stage.querySelector('[data-lyr="'+it.id+'"]');
      if(g) g.style.display=((G.picked[it.id]||0)>0)?"":"none";
    });
    return;
  }
  if(s.type!=="gesture" || !G.gx) return;
  const gx=G.gx;
  if(s.parts && s.parts.length){
    const n = gx.progress>0 ? Math.min(s.parts.length, Math.ceil(gx.progress*s.parts.length)) : 0;
    stage.querySelectorAll("[data-part]").forEach((g,i)=>{ g.style.display = i<n ? "" : "none"; });
  }
  if(s.mode==="spread"){
    const sg=el("stamp-g");
    if(sg && sg.childElementCount!==gx.stamps.length){
      while(sg.firstChild) sg.removeChild(sg.firstChild);
      gx.stamps.forEach(p=>{
        const c=document.createElementNS(SVGNS,"circle");
        c.setAttribute("cx",p.x.toFixed(0)); c.setAttribute("cy",p.y.toFixed(0));
        c.setAttribute("r",s.paintR||17); c.setAttribute("opacity",".92");
        sg.appendChild(c);
      });
    }
  }
  if(s.mode==="stir" && s.swirl){
    const sw=el("swirl-g");
    if(sw){
      const c=s.center||{x:200,y:166};
      sw.setAttribute("opacity",(0.2+0.8*gx.progress).toFixed(2));
      sw.setAttribute("transform","rotate("+((gx.angle%360).toFixed(0))+" "+c.x+" "+c.y+")");
    }
  }
  if(s.mode==="pour"){
    const ps=el("pour-stream");
    if(ps){
      if(gx.pouring && s.target){
        ps.style.display="";
        ps.setAttribute("d","M"+gx.toolSvgX.toFixed(0)+" "+(gx.toolSvgY+18).toFixed(0)+" L"+s.target.cx+" "+s.target.cy);
      } else ps.style.display="none";
    }
  }
  if(s.mode==="oven"){
    const mv=el("oven-mover");
    if(mv) mv.setAttribute("transform", ovenMoverTransform(gx));
  }
}
function sparkle(stage){
  if(reducedMotion||!stage) return;
  const chars=["\u2728","\u2B50","\u2764\uFE0F"];
  for(let i=0;i<3;i++){
    const sp=document.createElement("span"); sp.className="sparkle"; sp.textContent=rand(chars);
    sp.style.left=(30+Math.random()*40)+"%"; sp.style.top=(46+Math.random()*14)+"%";
    stage.appendChild(sp); setTimeout(()=>sp.remove(),850);
  }
}
function advanceStep(){
  clearHint();
  G._advQueued=false;
  G.stepIdx++; G.tapsDone=0; G.gx=null;
  if(G.stepIdx>=G.recipe.steps.length){ finishRecipe(); return; }
  render();
  sayCurrentStep();
  armHint();
}
function finishRecipe(){
  stopCooking();
  if(!G.rewardGiven){
    G.rewardGiven=true;
    const id=G.recipe.id;
    save.stickers[id]=true;
    save.completions[id]=(save.completions[id]||0)+1;
    save.totalStars+=1;
    MILESTONES.forEach(m=>{ if(!save.stickers[m.id] && m.test(save)) save.stickers[m.id]=true; });
    persist();
  }
  G.served=false;
  goScreen("celebrate");
}
function stopCooking(){
  G.cookToken++;
  if(G.cookTimer){ clearInterval(G.cookTimer); G.cookTimer=null; }
  G.cooking=false;
}
function clearHint(){ if(G.hintTimer){ clearTimeout(G.hintTimer); G.hintTimer=null; } }
function armHint(){
  clearHint();
  G.hintTimer=setTimeout(()=>{
    if(G.screen!=="cook") return;
    const s=curStep(); if(!s) return;
    const t=el("speech-text"); if(t&&s.hint) t.textContent=s.hint;
    document.querySelectorAll(".tray-item:not(.used), .big-action, .gesture-tip").forEach(b=>b.classList.add("hint-pulse"));
    setTimeout(()=>document.querySelectorAll(".hint-pulse").forEach(b=>b.classList.remove("hint-pulse")),2600);
  }, 9000);
}
function bindCook(app){
  bindTopBar(app);
  const s=curStep(); if(!s) return;
  $("#btn-say",app).addEventListener("click",()=>{ AudioSys.ensure(); AudioSys.speak(s.say); });
  if(s.type==="pick"){
    app.querySelectorAll("[data-item]").forEach(btn=>{
      btn.addEventListener("click",ev=>{
        if(Date.now()<G.suppressClickUntil) return;
        applyPick(btn.dataset.item, btn);
      });
      btn.addEventListener("pointerdown",ev=>startDrag(ev, btn, s));
    });
    refreshDoneZone();
  }
  if(s.type==="choose"){
    app.querySelectorAll("[data-choice]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        const c=s.choices.find(x=>x.id===btn.dataset.choice); if(!c) return;
        G.chosen[sIdxKey(G.stepIdx)]=c.id;
        AudioSys.pop(); sparkle(el("stage"));
        setTimeout(()=>advanceStep(), reducedMotion?60:420);
      });
    });
  }
  if(s.type==="taps"){
    const doTap=()=>{
      if(G.tapsDone>=s.taps) return;
      G.tapsDone++;
      if(s.sfx==="bubble") AudioSys.bubble(); else if(s.sfx==="whirr") AudioSys.whirr(); else AudioSys.pop();
      const stage=el("stage");
      if(stage){ stage.classList.remove("squash","wiggle"); void stage.offsetWidth; stage.classList.add(s.anim==="wiggle"?"wiggle":"squash"); sparkle(stage); }
      const dots=app.querySelectorAll(".tap-dot");
      if(dots[G.tapsDone-1]) dots[G.tapsDone-1].classList.add("filled");
      const btn=$("#btn-tap-action"); if(btn) btn.textContent = G.tapsDone>=s.taps ? "Yay! \u2713" : "Tap! "+(s.taps-G.tapsDone)+" to go";
      if(G.tapsDone>=s.taps){ AudioSys.ding(); setTimeout(()=>advanceStep(), reducedMotion?60:450); }
    };
    const stage=el("stage"); if(stage) stage.addEventListener("pointerdown",doTap);
    const btn=$("#btn-tap-action"); if(btn) btn.addEventListener("click",doTap);
  }
  if(s.type==="cook"){
    const btn=$("#btn-cook-start");
    if(btn) btn.addEventListener("click",()=>{
      if(G.cooking) return;
      G.cooking=true; btn.disabled=true; btn.textContent="Cooking...";
      const stage=el("stage"); if(stage) stage.classList.add("cooking");
      if(s.sfx==="bubble") AudioSys.bubble(); else if(s.sfx==="whirr") AudioSys.whirr(); else AudioSys.sizzle();
      const token=++G.cookToken, totalTicks=Math.max(1,Math.round(s.secs*10));
      const fill=el("cook-fill");
      let ticks=0;
      G.cookTimer=setInterval(()=>{
        if(token!==G.cookToken){ clearInterval(G.cookTimer); return; }
        ticks++;
        const p=Math.min(1,ticks/totalTicks);
        if(fill) fill.style.width=(p*100)+"%";
        if(p>=1){ stopCooking(); AudioSys.ding(); advanceStep(); }
      },100);
    });
  }
  if(s.type==="action"){
    const btn=$("#btn-do-action");
    if(btn) btn.addEventListener("click",()=>{
      AudioSys.pop(); sparkle(el("stage"));
      btn.disabled=true;
      setTimeout(()=>advanceStep(), reducedMotion?60:380);
    });
  }
  if(s.type==="gesture"){
    bindGesture(app,s);
  }
  armHint();
}
function applyPick(itemId, btnEl){
  const s=curStep(); if(!s||s.type!=="pick") return;
  const it=s.items.find(x=>x.id===itemId); if(!it) return;
  const need=it.count||1;
  if((G.picked[itemId]||0)>=need) return;
  G.picked[itemId]=(G.picked[itemId]||0)+1;
  AudioSys.pop();
  flyToStage(it, btnEl);
  refreshStage();
  sparkle(el("stage"));
  refreshDoneZone();
  armHint();
}
function flyToStage(it, fromEl){
  if(reducedMotion||!fromEl) return;
  try{
    const stage=el("stage"); if(!stage) return;
    const a=fromEl.getBoundingClientRect(), b=stage.getBoundingClientRect();
    const ghost=document.createElement("div"); ghost.className="fly-dot"; ghost.innerHTML=ICONS[it.icon];
    ghost.style.left=(a.left+a.width/2-32)+"px"; ghost.style.top=(a.top+a.height/2-32)+"px";
    document.body.appendChild(ghost);
    requestAnimationFrame(()=>{ ghost.style.left=(b.left+b.width/2-32)+"px"; ghost.style.top=(b.top+b.height/2-40)+"px"; ghost.style.transform="scale(.7)"; });
    setTimeout(()=>ghost.remove(),500);
  }catch(e){}
}
function startDrag(ev, btn, s){
  if(btn.disabled) return;
  const itemId=btn.dataset.item;
  const startX=ev.clientX, startY=ev.clientY;
  let ghost=null, moved=false;
  const move=e=>{
    if(!ghost && Math.hypot(e.clientX-startX,e.clientY-startY)>14){
      moved=true;
      ghost=document.createElement("div"); ghost.className="drag-ghost";
      const it=s.items.find(x=>x.id===itemId); ghost.innerHTML=ICONS[it?it.icon:"starIcon"];
      document.body.appendChild(ghost);
    }
    if(ghost){ ghost.style.left=(e.clientX-38)+"px"; ghost.style.top=(e.clientY-38)+"px"; }
  };
  const up=e=>{
    window.removeEventListener("pointermove",move);
    window.removeEventListener("pointerup",up);
    window.removeEventListener("pointercancel",up);
    if(ghost){ ghost.remove(); }
    if(moved){
      G.suppressClickUntil=Date.now()+350;
      const stage=el("stage");
      if(stage){
        const r=stage.getBoundingClientRect();
        if(e.clientX>=r.left-24 && e.clientX<=r.right+24 && e.clientY>=r.top-24 && e.clientY<=r.bottom+24){
          applyPick(itemId, btn);
        }
      }
    }
  };
  window.addEventListener("pointermove",move);
  window.addEventListener("pointerup",up);
  window.addEventListener("pointercancel",up);
}

/* =========================================================
   HANDS-ON GESTURE ENGINE — realistic pretend-play actions.
   Modes: saw (knife / rolling pin / sponge back-and-forth),
   spread (drag the spoon and paint coverage), stir (circles),
   pour (drag the jug over the target and tip it),
   flip (swipe up), oven (drag the dish into the open oven).
   Every mode also completes with plain taps, so the youngest
   chefs and limited-motor players can always succeed.
   ========================================================= */
function newGestureState(s){
  const st={ progress:0, dragging:false, done:false, acc:0, lastX:0, lastY:0, downX:0, downY:0, downT:0,
    moved:0, lastAng:null, angle:0, stamps:[], cells:{}, cellsTotal:0, pourInt:null, pouring:false,
    toolSvgX:200, toolSvgY:120, dishX:200, dishY:226 };
  if(s.mode==="spread" && s.zone){
    const z=s.zone, cell=24; let total=0;
    for(let gx0=z.cx-z.rx; gx0<z.cx+z.rx; gx0+=cell){
      for(let gy0=z.cy-z.ry; gy0<z.cy+z.ry; gy0+=cell){
        const ccx=gx0+cell/2, ccy=gy0+cell/2;
        const q=((ccx-z.cx)/z.rx)*((ccx-z.cx)/z.rx)+((ccy-z.cy)/z.ry)*((ccy-z.cy)/z.ry);
        if(q<=1) total++;
      }
    }
    st.cellsTotal=Math.max(4,total);
  }
  return st;
}
function toolHomePct(s){
  if(s.mode==="pour" && s.toolHome) return {x:s.toolHome.x/4, y:s.toolHome.y/3};
  if(s.mode==="stir") return {x:50, y:50};
  if(s.mode==="flip") return {x:57, y:63};
  return {x:50, y:56};
}
function ovenDoorHTML(){
  return '<g><rect x="136" y="118" width="128" height="76" rx="10" fill="#2E3942"/>'
    +'<rect x="136" y="118" width="128" height="76" rx="10" fill="#FF9F2E" opacity=".14"/>'
    +'<path d="M128 200 L272 200 L292 246 L108 246 Z" fill="#5B6B7A"/>'
    +'<path d="M128 200 L272 200 L292 246 L108 246 Z" fill="none" stroke="#3E4A56" stroke-width="4"/>'
    +'<rect x="174" y="224" width="52" height="8" rx="4" fill="#3E4A56"/></g>';
}
function ovenMoverTransform(gx){
  const prox=Math.max(0,Math.min(1,(226-gx.dishY)/(226-156)));
  const sc=1-0.42*prox;
  return 'translate('+gx.dishX.toFixed(1)+' '+gx.dishY.toFixed(1)+') scale('+sc.toFixed(3)+') translate(-200 -190)';
}
/* Static, parser-created placeholders for everything a gesture animates.
   refreshStage() reveals/moves these with DOM calls only — the scene SVG
   is never rebuilt through svg.innerHTML, which some browsers drop,
   leaving an empty stage (the "only the spoon shows" bug). */
function gestureStaticHTML(s){
  let h="";
  if(s.parts && s.parts.length){
    s.parts.forEach((p,i)=>{ h+='<g data-part="'+i+'" style="display:none">'+p+'</g>'; });
  }
  if(s.mode==="spread"){
    h+='<g id="stamp-g" fill="'+(s.paint||"#E5502F")+'"></g>';
  }
  if(s.mode==="stir" && s.swirl){
    const c=s.center||{x:200,y:166};
    h+='<g id="swirl-g" opacity="0" transform="rotate(0 '+c.x+' '+c.y+')">'+s.swirl+'</g>';
  }
  if(s.mode==="pour" && s.target){
    h+='<path id="pour-stream" style="display:none" d="M0 0" stroke="'+(s.stream||"#FBEBCB")+'" stroke-width="7" stroke-linecap="round" opacity=".85" fill="none"/>';
  }
  return h;
}
function buildSceneSVG(){
  const r=G.recipe, s=curStep();
  let inner=stageLayersHTML(), door="";
  if(s && s.type==="gesture"){
    inner+=gestureStaticHTML(s);
    if(s.mode==="oven") door=ovenDoorHTML();
  }
  let dish=dishWrap(inner);
  if(s && s.type==="gesture" && s.mode==="oven" && G.gx){
    dish='<g id="oven-mover" transform="'+ovenMoverTransform(G.gx)+'">'+dish+'</g>';
  }
  return sceneBase(r.equip)+door+dish;
}
function bindGesture(app,s){
  const stage=el("stage"); if(!stage) return;
  if(!G.gx) G.gx=newGestureState(s);
  const gx=G.gx;
  refreshStage(); /* sync parts/stamps/mover if this is a re-render mid-gesture */
  const tool=el("tool-hand"), fill=el("gesture-fill");
  const zone=s.zone||{cx:200,cy:190,rx:80,ry:60};
  const center=s.center||{x:200,y:166};
  let lastPaint=0, lastStroke=0, lastSwirlSfx=0;
  function toSVG(e){
    const r=stage.getBoundingClientRect();
    return { x:(e.clientX-r.left)*400/r.width, y:(e.clientY-r.top)*300/r.height, px:e.clientX-r.left, py:e.clientY-r.top };
  }
  function paint(){
    const now=performance.now(); if(now-lastPaint<45) return; lastPaint=now;
    refreshStage();
  }
  function setP(p){
    if(gx.done) return;
    gx.progress=Math.max(gx.progress, Math.min(1,p));
    if(fill) fill.style.width=(gx.progress*100)+"%";
    if(gx.progress>=1) completeGesture();
  }
  function completeGesture(){
    if(gx.done) return;
    gx.done=true;
    if(gx.pourInt){ clearInterval(gx.pourInt); gx.pourInt=null; }
    AudioSys.ding(); sparkle(stage);
    setTimeout(()=>{ if(G.gx===gx && G.screen==="cook") advanceStep(); }, reducedMotion?80:430);
  }
  function showTool(p){
    if(!tool) return;
    tool.classList.remove("demo","demo-saw","demo-spread","demo-stir","demo-pour","demo-flip");
    tool.classList.add("show");
    tool.style.left=p.px+"px"; tool.style.top=p.py+"px";
  }
  function inZone(x,y,z,pad){
    const q=((x-z.cx)/((z.rx||z.r)*(pad||1)))*((x-z.cx)/((z.rx||z.r)*(pad||1)))+((y-z.cy)/((z.ry||z.r)*(pad||1)))*((y-z.cy)/((z.ry||z.r)*(pad||1)));
    return q<=1;
  }
  function addStamp(x,y){
    const last=gx.stamps[gx.stamps.length-1];
    if(last && Math.hypot(x-last.x,y-last.y)<15) return;
    gx.stamps.push({x:x,y:y});
    if(inZone(x,y,zone,1)){
      gx.cells[Math.floor(x/24)+":"+Math.floor(y/24)]=1;
      setP(Object.keys(gx.cells).length/(gx.cellsTotal*0.62));
    }
    paint();
  }
  function sawStroke(){
    const strokes=gx.acc/55;
    const whole=Math.floor(strokes);
    if(whole>lastStroke){
      lastStroke=whole;
      if(s.tool==="knifeIcon") AudioSys.noise(0.07,0.055,850);
      else AudioSys.tone(240,0.07,"sine",0.07);
    }
    setP(strokes/(s.target||5));
  }
  function stirBy(x,y){
    const ang=Math.atan2(y-center.y, x-center.x);
    if(gx.lastAng!==null){
      let d=ang-gx.lastAng;
      while(d>Math.PI) d-=Math.PI*2;
      while(d<-Math.PI) d+=Math.PI*2;
      gx.acc+=Math.abs(d); gx.angle+=d*180/Math.PI;
      if(gx.acc-lastSwirlSfx>1.4){ lastSwirlSfx=gx.acc; AudioSys.bubble(); }
      setP(gx.acc/(Math.PI*2*(s.target||2)));
      paint();
    }
    gx.lastAng=ang;
  }
  function doFlip(){
    if(gx.done) return;
    stage.classList.add("flipping");
    AudioSys.boing();
    setTimeout(()=>{ if(G.gx===gx) completeGesture(); }, reducedMotion?60:480);
  }
  function ovenSuccess(){
    if(gx.done) return;
    gx.dishX=200; gx.dishY=156;
    refreshStage();
    AudioSys.click();
    setTimeout(()=>{ if(G.gx===gx) completeGesture(); }, reducedMotion?60:320);
  }
  function tapHelp(x,y){
    /* a plain tap always helps a little — nobody gets stuck */
    if(s.mode==="saw"){ gx.acc+=55; sawStroke(); paint(); }
    else if(s.mode==="spread"){
      [[0,0],[-15,-6],[15,-6],[-8,10],[10,10]].forEach(o=>addStamp(x+o[0],y+o[1]));
      /* Pip lends a hand: a few extra dabs land around the dish too */
      for(let i=0;i<3;i++){
        const a=Math.random()*Math.PI*2, rr=Math.sqrt(Math.random())*0.98;
        addStamp(zone.cx+Math.cos(a)*zone.rx*rr, zone.cy+Math.sin(a)*zone.ry*rr);
      }
    }
    else if(s.mode==="pour"){
      if(s.target && inZone(x,y,{cx:s.target.cx,cy:s.target.cy,rx:s.target.r,ry:s.target.r},1.25)){
        AudioSys.bubble(); setP(gx.progress+0.34); paint();
      }
    }
    else if(s.mode==="stir"){ gx.acc+=Math.PI*0.9; gx.angle+=55; AudioSys.bubble(); setP(gx.acc/(Math.PI*2*(s.target||2))); paint(); }
    else if(s.mode==="flip"){ doFlip(); }
    else if(s.mode==="oven"){ if(y<185) ovenSuccess(); else { gx.dishY=Math.max(160,gx.dishY-26); refreshStage(); } }
  }
  stage.addEventListener("pointerdown",e=>{
    if(gx.done) return;
    AudioSys.ensure();
    try{ stage.setPointerCapture(e.pointerId); }catch(err){}
    const p=toSVG(e);
    gx.dragging=true; gx.downX=p.x; gx.downY=p.y; gx.downT=performance.now(); gx.moved=0;
    gx.lastX=p.x; gx.lastY=p.y; gx.lastAng=null;
    gx.toolSvgX=p.x; gx.toolSvgY=p.y;
    showTool(p);
    if(s.mode==="oven"){ gx.dishX=Math.max(120,Math.min(280,p.x)); gx.dishY=Math.max(150,Math.min(232,p.y)); refreshStage(); }
    if(s.mode==="pour"){
      gx.pourInt=setInterval(()=>{
        if(G.gx!==gx || !gx.dragging){ clearInterval(gx.pourInt); gx.pourInt=null; return; }
        const wasPouring=gx.pouring;
        gx.pouring = s.target ? inZone(gx.toolSvgX,gx.toolSvgY,{cx:s.target.cx,cy:s.target.cy,rx:s.target.r,ry:s.target.r},1.05) : false;
        if(gx.pouring){ AudioSys.bubble(); setP(gx.progress+0.085); }
        if(gx.pouring!==wasPouring || gx.pouring) paint();
      },110);
    }
  });
  stage.addEventListener("pointermove",e=>{
    if(!gx.dragging || gx.done) return;
    const p=toSVG(e);
    const dx=p.x-gx.lastX, dy=p.y-gx.lastY;
    gx.moved+=Math.abs(dx)+Math.abs(dy);
    gx.lastX=p.x; gx.lastY=p.y; gx.toolSvgX=p.x; gx.toolSvgY=p.y;
    showTool(p);
    if(s.mode==="saw"){ gx.acc+=Math.abs(dx)+Math.abs(dy)*0.4; sawStroke(); paint(); }
    else if(s.mode==="spread"){ addStamp(p.x,p.y); }
    else if(s.mode==="stir"){ stirBy(p.x,p.y); }
    else if(s.mode==="oven"){ gx.dishX=Math.max(120,Math.min(280,p.x)); gx.dishY=Math.max(148,Math.min(232,p.y)); paint(); }
    else if(s.mode==="pour"){ paint(); }
  });
  function endGesture(e){
    if(!gx.dragging) return;
    gx.dragging=false;
    if(gx.pourInt){ clearInterval(gx.pourInt); gx.pourInt=null; }
    if(gx.pouring){ gx.pouring=false; refreshStage(); }
    if(gx.done) return;
    const p=toSVG(e);
    const quickTap = gx.moved<12 && (performance.now()-gx.downT)<400;
    if(s.mode==="flip"){
      if(gx.downY-p.y>30 || quickTap) doFlip();
      return;
    }
    if(s.mode==="oven"){
      const d=Math.hypot(gx.dishX-200, gx.dishY-156);
      if(d<62) ovenSuccess();
      else if(quickTap) tapHelp(p.x,p.y);
      return;
    }
    if(quickTap) tapHelp(p.x,p.y);
  }
  stage.addEventListener("pointerup",endGesture);
  stage.addEventListener("pointercancel",endGesture);
}

/* ---------- CELEBRATION ---------- */
function confettiHTML(){
  if(reducedMotion) return "";
  const colors=["#FF6B4A","#FFC93C","#22B8A2","#FF8FAB","#7BC950","#7ED3E8"];
  let h="";
  for(let i=0;i<26;i++){
    h+='<span class="confetti" style="left:'+(Math.random()*96)+'%;background:'+rand(colors)+';animation-duration:'+(2.2+Math.random()*1.8)+'s;animation-delay:'+(Math.random()*0.7)+'s"></span>';
  }
  return h;
}
function finalDishLayers(recipe){
  let out="";
  recipe.steps.forEach(s=>{
    if(s.layer) out+=s.layer;
    if(s.type==="pick") s.items.forEach(it=>{ if(it.layer) out+=it.layer; });
  });
  /* note: celebration shows the full dish using the final chosen options recorded during play */
  return out;
}
function viewCelebrate(){
  const r=G.recipe, cust=CUSTOMERS[G.recipe? RECIPES.indexOf(r)%CUSTOMERS.length : 0];
  const custForRecipe = CUSTOMERS[RECIPES.indexOf(r)%CUSTOMERS.length];
  let stageDish = "";
  r.steps.forEach((s,i)=>{
    if(s.layer) stageDish+=s.layer;
    if(s.type==="pick") s.items.forEach(it=>{ if(it.layer) stageDish+=it.layer; });
    if(s.type==="choose"){ const c=s.choices.find(x=>x.id===G.chosen[sIdxKey(i)]); if(c&&c.layer) stageDish+=c.layer; }
  });
  const newMilestones = MILESTONES.filter(m=>save.stickers[m.id]);
  return topBarHTML({home:true})
  +'<section class="celebrate" aria-label="Celebration">'
  + confettiHTML()
  +'<h2>'+(G.served?"Yummy! Great cooking!":"Your "+esc(r.name)+" is ready!")+'</h2>'
  +'<p class="yum">'+(G.served? esc(custForRecipe.name)+" loved it! You earned a sticker!" : "It looks delicious. Give it to your hungry friend!")+'</p>'
  +'<div style="display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;justify-content:center">'
  +'<div class="serve-stage" style="width:min(300px,60vw)"><svg viewBox="0 0 400 300" role="img" aria-label="Finished '+esc(r.name)+'"><rect x="0" y="0" width="400" height="300" style="fill:var(--wall)"/><rect x="0" y="212" width="400" height="88" style="fill:var(--counter)"/>'+dishWrap(stageDish)+'</svg></div>'
  +'<div class="customer" style="width:clamp(96px,24vw,140px)">'+animalSVG(custForRecipe.kind, G.served)+'</div>'
  +'</div>'
  +(G.served
    ? '<div class="sticker-award"><span class="art">'+ICONS[r.sticker]+'</span><span class="txt"><b>New sticker: '+esc(r.name)+'!</b><span>You have '+stickerTotal()+' of '+totalStickerSlots()+' stickers. Stars earned: '+save.totalStars+' \u2B50</span></span></div>'
      +'<div class="lobby-btns">'
      +'<button class="btn btn-play" id="btn-next-order" style="font-size:clamp(20px,4vw,27px)">Next Order \u25B6</button>'
      +'<button class="btn btn-teal" id="btn-play-again">Cook It Again</button>'
      +'<button class="btn btn-sun" id="btn-to-recipes">All Recipes</button>'
      +'</div>'
    : '<button class="btn btn-play" id="btn-serve" style="font-size:clamp(22px,4.6vw,30px)">Serve It! \u2764\uFE0F</button>')
  +'</section>';
}
function bindCelebrate(app){
  bindTopBar(app);
  AudioSys.fanfare();
  const serve=$("#btn-serve",app);
  if(serve) serve.addEventListener("click",()=>{
    G.served=true; AudioSys.ding(); render();
    AudioSys.speak("Yummy! Great cooking, little chef!");
  });
  const next=$("#btn-next-order",app);
  if(next) next.addEventListener("click",()=>{ AudioSys.click(); newOrder(); goScreen("lobby"); });
  const again=$("#btn-play-again",app);
  if(again) again.addEventListener("click",()=>{ AudioSys.click(); startRecipe(G.recipe.id); });
  const all=$("#btn-to-recipes",app);
  if(all) all.addEventListener("click",()=>{ AudioSys.click(); goScreen("recipes"); });
}

/* ---------- STICKERS ---------- */
function viewStickers(){
  const cells=RECIPES.map(r=>{
    const got=!!save.stickers[r.id], cnt=save.completions[r.id]||0;
    return '<div class="sticker-cell'+(got?"":" locked")+'"><div class="art">'+ICONS[r.sticker]+'</div><div class="nm">'+esc(r.name)+'</div><div class="cnt">'+(got?("Cooked "+cnt+" time"+(cnt===1?"":"s")):"Cook it to earn!")+'</div></div>';
  }).join("");
  const ms=MILESTONES.map(m=>{
    const got=!!save.stickers[m.id];
    return '<div class="sticker-cell'+(got?"":" locked")+'"><div class="art">'+ICONS[m.icon]+'</div><div class="nm">'+esc(m.name)+'</div><div class="cnt">'+(got?"Earned! \u2605":"Keep cooking!")+'</div></div>';
  }).join("");
  return topBarHTML({home:true, title:"My Sticker Book"})
    +'<h2 class="section-title">\u2B50 '+stickerTotal()+' of '+totalStickerSlots()+' stickers \u2B50</h2>'
    +'<p class="section-sub">Cook a recipe to earn its sticker. Stickers are never taken away!</p>'
    +'<div class="sticker-grid">'+cells+ms+'</div>'
    +'<div class="lobby-btns"><button class="btn btn-play" id="btn-sticker-cook" style="font-size:clamp(20px,4vw,26px)">Let\u2019s Cook!</button></div>';
}
function bindStickersExtra(app){
  const b=$("#btn-sticker-cook",app); if(b) b.addEventListener("click",()=>{ AudioSys.click(); goScreen("recipes"); });
}

/* ---------- MODALS: pause + grown-ups ---------- */
function openModal(html){
  el("modal-root").innerHTML='<div class="modal-back" id="modal-back"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';
  $("#modal-back").addEventListener("pointerdown",e=>{ if(e.target.id==="modal-back") closeModal(); });
}
function closeModal(){ el("modal-root").innerHTML=""; }
function openPause(){
  const wasCooking=G.cooking; stopCooking();
  openModal('<h2>\u23F8 Paused</h2><p>Take your time, little chef. Nothing is lost!</p>'
    +'<div class="modal-btns">'
    +'<button class="btn btn-green" id="m-resume">Keep Cooking</button>'
    +'<button class="btn btn-sun" id="m-restart">Restart Recipe</button>'
    +'<button class="btn btn-ghost" id="m-home">Go Home</button>'
    +'</div>');
  $("#m-resume").addEventListener("click",()=>{ AudioSys.click(); closeModal(); if(G.screen==="cook") render(); });
  $("#m-restart").addEventListener("click",()=>{ AudioSys.click(); closeModal(); if(G.recipe) startRecipe(G.recipe.id); });
  $("#m-home").addEventListener("click",()=>{ AudioSys.click(); closeModal(); goScreen("lobby"); });
}
function bindGrownHold(btn){
  if(!btn) return;
  let timer=null;
  const start=e=>{ e.preventDefault(); timer=setTimeout(()=>{ openGrownSettings(); },1200); };
  const cancel=()=>{ if(timer){ clearTimeout(timer); timer=null; } };
  btn.addEventListener("pointerdown",start);
  btn.addEventListener("pointerup",cancel);
  btn.addEventListener("pointerleave",cancel);
  btn.addEventListener("click",e=>{ e.preventDefault(); });
}
function toggleRow(label, key){
  return '<div class="setting-row"><span>'+label+'</span><button class="toggle'+(save[key]?" on":"")+'" data-toggle="'+key+'" role="switch" aria-checked="'+!!save[key]+'" aria-label="'+label+'"></button></div>';
}
function openGrownSettings(){
  openModal('<h2>Grown-ups</h2><p>Settings for parents and caregivers. Game progress is stored only in this browser — no accounts, no personal information.</p>'
    + toggleRow("\uD83D\uDD0A Sound effects","sound")
    + toggleRow("\uD83C\uDFB5 Background music","music")
    + toggleRow("\uD83D\uDDE3\uFE0F Spoken instructions","voice")
    +'<div class="setting-row"><span>\u270B Controls</span><span style="font-weight:700;color:var(--ink-soft);font-size:15px;text-align:right">Tap or drag —<br/>both always work</span></div>'
    +'<div class="modal-btns">'
    +'<button class="btn btn-ghost" id="m-reset">Reset All Progress</button>'
    +'<button class="btn btn-teal" id="m-close">Done</button>'
    +'</div><div id="reset-zone"></div>');
  el("modal-root").querySelectorAll("[data-toggle]").forEach(t=>{
    t.addEventListener("click",()=>{
      const k=t.dataset.toggle; save[k]=!save[k]; persist();
      t.classList.toggle("on",save[k]); t.setAttribute("aria-checked",!!save[k]);
      if(k==="music"){ if(save.music){ AudioSys.ensure(); AudioSys.startMusic(); } else AudioSys.stopMusic(); }
      if(k==="sound"&&!save.sound){ AudioSys.stopMusic(); AudioSys.stopSpeak(); }
      if(k==="sound"&&save.sound){ AudioSys.ensure(); AudioSys.click(); if(save.music) AudioSys.startMusic(); }
    });
  });
  $("#m-close").addEventListener("click",()=>{ closeModal(); render(); });
  $("#m-reset").addEventListener("click",()=>{
    el("reset-zone").innerHTML='<p style="color:#C23A1E;font-weight:800;margin-top:14px">This removes all stickers and stars. Are you sure?</p><div class="modal-btns"><button class="btn btn-pink" id="m-reset-yes">Yes, Reset Everything</button><button class="btn btn-ghost" id="m-reset-no">Keep My Stickers</button></div>';
    $("#m-reset-yes").addEventListener("click",()=>{
      save={ stickers:{}, completions:{}, totalStars:0, sound:save.sound, music:save.music, voice:save.voice, played:false };
      persist(); closeModal(); newOrder(); goScreen("welcome");
    });
    $("#m-reset-no").addEventListener("click",()=>{ el("reset-zone").innerHTML=""; });
  });
}

/* stickers screen needs its extra button bound too */
const _bindScreen = bindScreen;
bindScreen = function(){
  _bindScreen();
  if(G.screen==="stickers") bindStickersExtra(el("app"));
};

/* ---------- boot ---------- */
document.addEventListener("pointerdown",function once(){
  AudioSys.ensure();
  if(save.music && save.sound) AudioSys.startMusic();
  document.removeEventListener("pointerdown",once);
});
render();
